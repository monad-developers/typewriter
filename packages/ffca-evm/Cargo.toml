[package]
name = "ffca-evm"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ffca-evm"
path = "src/main.rs"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
monad-revm = { git = "https://github.com/category-labs/monad-revm", tag = "v0.3.0", features = ["optional_balance_check", "optional_no_base_fee"] }
napi = { version = "=3.9.0", default-features = false, features = ["napi8"] }
napi-derive = "=3.5.6"
revm = { version = "34.0.0", default-features = false, features = ["std", "optional_balance_check", "optional_no_base_fee"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
