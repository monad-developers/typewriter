[package]
name = "evm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[[bin]]
name = "evm"
path = "src/main.rs"

[dependencies]
monad-revm = { git = "https://github.com/category-labs/monad-revm", rev = "821b8edecaea510c33ad9303c753b4286802caa4", default-features = false, features = ["std", "c-kzg", "secp256k1", "portable", "blst", "optional_no_base_fee", "memory_limit"] }
revm = { version = "34.0.0", default-features = false, features = ["std", "c-kzg", "secp256k1", "portable", "blst", "optional_no_base_fee", "memory_limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
