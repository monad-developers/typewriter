name: PR

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Title
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Check conventional commit title
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+'

          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must use Conventional Commits, for example: feat: add production deploys"
            echo "::error::Received: $PR_TITLE"
            exit 1
          fi
