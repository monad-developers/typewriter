name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - name: Install monad foundry
        run: |
          mkdir -p ~/.foundry/bin
          curl -fsSL https://github.com/category-labs/foundry/releases/download/v1.5.0-monad.0.3.0/foundry_v1.5.0-monad.0.3.0_linux_amd64.tar.gz \
            | tar -xz -C ~/.foundry/bin
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - name: Install monad foundry
        run: |
          mkdir -p ~/.foundry/bin
          curl -fsSL https://github.com/category-labs/foundry/releases/download/v1.5.0-monad.0.3.0/foundry_v1.5.0-monad.0.3.0_linux_amd64.tar.gz \
            | tar -xz -C ~/.foundry/bin
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - name: Install monad foundry
        run: |
          mkdir -p ~/.foundry/bin
          curl -fsSL https://github.com/category-labs/foundry/releases/download/v1.5.0-monad.0.3.0/foundry_v1.5.0-monad.0.3.0_linux_amd64.tar.gz \
            | tar -xz -C ~/.foundry/bin
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run test
